<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Validação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Cadastro de Dados</h2>
    <form id="formDados">
      <div class="field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <button type="submit">Enviar e Processar</button>
    </form>

    <pre id="resultado" style="display: none;"></pre>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
